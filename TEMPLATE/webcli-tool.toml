# What this tool is and may do. A person reads this before installing it, and webcli holds the tool to it.
# The rules: https://github.com/truefrontier/webcli/blob/main/docs/webcli-tool-manifest.md
# Keep it in step with webcli_tool_yourtool/__init__.py (ADAPTER) and endpoints.py (HOSTS): `webcli lint yourtool`
# checks that they agree.
name = "yourtool"
version = "0.1.0"
adapter_api = 1
requires_webcli = ">=1.0.0rc1,<2"
summary = "www.example.com, read-only: page (its headings and links), status"
identity = "yourtool"
hosts = ["www.example.com"]
maintainers = ["github:your-github-login"]
license = "MIT"

[[commands]]
name = "status"
strategy = "cookie"
requests = ["GET www.example.com/"]

[[commands]]
name = "page"
strategy = "cookie"
requests = ["GET www.example.com/"]
